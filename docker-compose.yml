# Full local stack: `pnpm docker:up` runs everything at http://localhost:31997.
# `pnpm db:up` starts only postgres, for running `pnpm dev` on the host instead.
# Production is Vercel + Neon Postgres + Vercel Blob. Blob has no local emulator, so image
# uploads use the real store via BLOB_READ_WRITE_TOKEN (`vercel env pull` writes it to .env.local).
# Host port is offset (5433) so this can run beside another local Postgres.
services:
  postgres:
    image: postgres:17-alpine
    container_name: tm-postgres
    environment:
      POSTGRES_USER: tm
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-LocalDev_Pa55w0rd}"
      POSTGRES_DB: transcendental_meditation
    ports:
      - "5433:5432"
    volumes:
      - tm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tm -d transcendental_meditation"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: schema migrations only. Administrator initialization is an explicit action.
  migrate:
    build:
      context: .
      target: build
    image: tm-web-build
    container_name: tm-migrate
    working_dir: /repo/apps/web
    environment:
      DATABASE_URL: &database_url "postgresql://tm:${POSTGRES_PASSWORD:-LocalDev_Pa55w0rd}@postgres:5432/transcendental_meditation"
    command: pnpm exec prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner
    image: tm-web
    container_name: tm-web
    environment:
      DATABASE_URL: *database_url
      # Local-only default. Never reuse this value in production.
      AUTH_SECRET: "${AUTH_SECRET:-local-docker-secret-change-me-0123456789}"
      BLOB_READ_WRITE_TOKEN: "${BLOB_READ_WRITE_TOKEN:-}"
    ports:
      - "31997:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  tm-postgres-data:
