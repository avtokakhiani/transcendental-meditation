name: Deploy to Vercel

# Every push to main is deployed to production (https://www.learntm.ge).
# Required repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one halfway through a migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22.x"
  VERCEL_CLI: vercel@68.0.0
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.learntm.ge
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test shared package
        run: pnpm --filter @tm/shared test

      - name: Pull Vercel production settings
        run: pnpm dlx ${{ env.VERCEL_CLI }} pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Migrations run before the new code goes live, against Neon's direct (unpooled) URL.
      - name: Apply database migrations
        working-directory: apps/web
        run: |
          DATABASE_URL=$(grep '^DATABASE_URL_UNPOOLED=' ../../.vercel/.env.production.local | cut -d= -f2- | tr -d '"')
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL_UNPOOLED missing from Vercel production env" >&2; exit 1; fi
          echo "::add-mask::$DATABASE_URL"
          DATABASE_URL="$DATABASE_URL" pnpm exec prisma migrate deploy

      # Vercel builds from source (root directory apps/web); .vercelignore keeps env files out.
      - name: Deploy to production
        run: pnpm dlx ${{ env.VERCEL_CLI }} deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
